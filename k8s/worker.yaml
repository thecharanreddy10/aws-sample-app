apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kubewise
  labels:
    app: worker
    project: kubewise
    tier: processing
    team: platform
    environment: hackathon
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        project: kubewise
        tier: processing
        team: platform
        environment: hackathon
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: 235951409983.dkr.ecr.us-east-1.amazonaws.com/kubewise-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: WORKER_INTERVAL_SECONDS
              value: "10"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, socket; socket.create_connection((os.getenv('REDIS_HOST', 'redis'), int(os.getenv('REDIS_PORT', '6379'))), 2).close()"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import os, socket; socket.create_connection((os.getenv('REDIS_HOST', 'redis'), int(os.getenv('REDIS_PORT', '6379'))), 2).close()"
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, socket; socket.create_connection((os.getenv('REDIS_HOST', 'redis'), int(os.getenv('REDIS_PORT', '6379'))), 2).close()"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kubewise
  labels:
    app: worker
    project: kubewise
    tier: processing
    team: platform
    environment: hackathon
spec:
  type: ClusterIP
  selector:
    app: worker
  ports:
    - name: metrics-placeholder
      protocol: TCP
      port: 9090
      targetPort: 9090
