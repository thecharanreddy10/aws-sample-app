apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-service
  namespace: kubewise
  labels:
    app: monitoring-service
    project: kubewise
    tier: observability
    team: platform
    environment: hackathon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-service-reader
  labels:
    app: monitoring-service
    project: kubewise
    tier: observability
    team: platform
    environment: hackathon
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-service-reader-binding
  labels:
    app: monitoring-service
    project: kubewise
    tier: observability
    team: platform
    environment: hackathon
subjects:
  - kind: ServiceAccount
    name: monitoring-service
    namespace: kubewise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-service-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: kubewise
  labels:
    app: monitoring-service
    project: kubewise
    tier: observability
    team: platform
    environment: hackathon
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: monitoring-service
  template:
    metadata:
      labels:
        app: monitoring-service
        project: kubewise
        tier: observability
        team: platform
        environment: hackathon
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: monitoring-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: monitoring-service
          image: kubewise/monitoring-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: REQUEST_TIMEOUT_SECONDS
              value: "10"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REFRESH_INTERVAL_SECONDS
              value: "30"
            - name: REDIS_KEY_MONITORING_CACHE
              value: kubewise:monitoring:cache
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  namespace: kubewise
  labels:
    app: monitoring-service
    project: kubewise
    tier: observability
    team: platform
    environment: hackathon
spec:
  type: ClusterIP
  selector:
    app: monitoring-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
